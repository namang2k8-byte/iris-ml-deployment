<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iris Flower Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f3f6fb; color:#182230; margin:0; }
    main { max-width:760px; margin:40px auto; padding:28px; background:white; border-radius:18px; box-shadow:0 8px 28px #1b365d12; }
    h1 { margin-top:0; } p { color:#526173; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    label { display:block; font-weight:600; font-size:.92rem; margin-bottom:6px; }
    input { box-sizing:border-box; width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; }
    button { margin-top:20px; padding:12px 18px; background:#155eef; color:white; border:0; border-radius:9px; font-weight:700; cursor:pointer; }
    pre { white-space:pre-wrap; background:#f8fafc; border-radius:10px; padding:16px; }
    .hint { font-size:.85rem; }
  </style>
</head>
<body>
<main>
  <h1>🌸 Iris Flower Predictor</h1>
  <p>Enter flower measurements in centimetres. The model returns a predicted species and class probabilities.</p>
  <form id="predict-form">
    <div class="grid">
      {% for feature in features %}
      <div>
        <label for="{{ feature }}">{{ feature.replace('_', ' ').title() }} (cm)</label>
        <input id="{{ feature }}" name="{{ feature }}" type="number" step="any" required value="{{ [5.1,3.5,1.4,0.2][loop.index0] }}">
      </div>
      {% endfor %}
    </div>
    <button type="submit">Predict species</button>
  </form>
  <h2>Prediction</h2>
  <pre id="result">Your prediction will appear here.</pre>
  <p class="hint">API: <code>POST /predict</code> · Health: <code>GET /health</code></p>
</main>
<script>
document.getElementById("predict-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const features = ["sepal_length", "sepal_width", "petal_length", "petal_width"]
    .map(name => Number(document.getElementById(name).value));
  const output = document.getElementById("result");
  output.textContent = "Predicting…";
  try {
    const response = await fetch("/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({features})
    });
    const data = await response.json();
    output.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    output.textContent = "Request failed. Check the server and try again.";
  }
});
</script>
</body>
</html>
